<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Archive - Portal</title>
    <style>
        :root {
            --primary-green: #1AB185;
            --primary-green-hover: #148c69;
            --bg-light-green: #E6F7F2;
            --text-dark: #333333;
            --text-grey: #6c757d;
            --bg-body: #F3F6F9;
            --white: #ffffff;
            --border-color: #e1e5ea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid var(--primary-green);
            position: relative;
            overflow: hidden;
            transition: max-width 0.3s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background-color: var(--bg-light-green);
            color: var(--primary-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            font-size: 24px;
        }

        .auth-header h2 {
            color: var(--text-dark);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-grey);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            color: var(--text-dark);
        }

        .form-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px var(--bg-light-green);
        }

        .name-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            color: var(--text-grey);
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 6px;
            accent-color: var(--primary-green);
            cursor: pointer;
        }

        .forgot-password, .terms-group a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover, .terms-group a:hover {
            text-decoration: underline;
        }

        .terms-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-grey);
            line-height: 1.4;
        }

        .terms-group input {
            margin-right: 10px;
            margin-top: 3px;
            accent-color: var(--primary-green);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-green);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-green-hover);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-grey);
        }

        .auth-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .name-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .auth-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div id="login-view" class="form-section active">
            <div class="auth-header">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                    </svg>
                </div>
                <h2>Document Archive</h2>
                <p>Welcome back! Please sign in.</p>
            </div>

            <form onsubmit="event.preventDefault(); window.location.href='user_dashboard.html';">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="User@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a onclick="toggleForm('register')">Create one</a>
            </div>
        </div>

        <div id="register-view" class="form-section">
            <div class="auth-header">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                    </svg>
                </div>
                <h2>Create an Account</h2>
                <p>Join the Document Archive system.</p>
            </div>

            <form onsubmit="event.preventDefault();">
                <div class="name-grid">
                    <div class="form-group">
                        <label for="reg-firstname">First Name</label>
                        <input type="text" id="reg-firstname" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-lastname">Last Name</label>
                        <input type="text" id="reg-lastname" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="User@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" placeholder="••••••••" required>
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="reg-terms" required>
                    <label for="reg-terms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a onclick="toggleForm('login')">Sign In</a>
            </div>
        </div>

    </div>

    <script>
        function toggleForm(formName) {
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');

            if (formName === 'register') {
                loginView.classList.remove('active');
                registerView.classList.add('active');
            } else {
                registerView.classList.remove('active');
                loginView.classList.add('active');
            }
        }
    </script>
</body>
</html>
